name: checkBigPrimes CI

on:
  push:
    paths:
      - 'src/checkBigPrimes.c'
  pull_request:
    paths:
      - 'src/checkBigPrimes.c'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: sudo apt-get install -y gcc
    - name: install gmp
      run: sudo apt-get install -y libgmp-dev
    - name: make
      run: gcc src/checkBigPrimes.c -o src/checkBigPrimes -lgmp
    - name: run
      run: time ./src/checkBigPrimes